openapi: 3.0.3
info:
  title: Demo Pet Store
  version: 1.0.0
servers:
  - url: http://localhost:8000
paths:
  /pets:
    get:
      operationId: listPets
      summary: Lista mascotas
      responses:
        "200":
          description: Lista de mascotas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
    post:
      operationId: createPet
      summary: Crea una mascota
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetIn"
      responses:
        "201":
          description: Creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "422":
          description: Datos inválidos
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getPet
      summary: Obtiene una mascota
      responses:
        "200":
          description: Mascota
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "404":
          description: No existe
    delete:
      operationId: deletePet
      summary: Elimina una mascota
      responses:
        "204":
          description: Eliminada
        "404":
          description: No existe
components:
  schemas:
    PetIn:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          example: Firulais
        tag:
          type: string
    Pet:
      allOf:
        - $ref: "#/components/schemas/PetIn"
        - type: object
          required: [id]
          properties:
            id:
              type: integer
